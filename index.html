<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>carflix · Tu auto, más simple.</title>
<meta name="description" content="Catálogo de vehículos 0km y usados de Carflix, Mendoza.">
<meta name="theme-color" content="#00AEEF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="carflix">
<meta property="og:title" content="Carflix · Catálogo">
<meta property="og:description" content="Tu auto, más simple. Mirá los autos disponibles y consultanos directo por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00AEEF; --black:#091117; --white:#fff; --accent:#126DFF;
    --line:#E3E7EA; --soft:#F3F5F6; --muted:#5B6670; --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Poppins,Montserrat,Arial,sans-serif;background:var(--white);color:var(--black);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  button{font:inherit;cursor:pointer}
  a{color:inherit}

  header{position:sticky;top:0;z-index:20;background:var(--blue);padding:calc(14px + env(safe-area-inset-top)) 0 10px}
  .bar{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:flex;align-items:center;gap:9px;color:var(--black);text-decoration:none}
  .logo svg{width:30px;height:28px;flex:none}
  .logo span{font-weight:700;font-size:24px;letter-spacing:-.6px;line-height:1}
  .hdr-wa{display:inline-flex;align-items:center;gap:7px;background:var(--black);color:var(--white);text-decoration:none;font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px}

  .hero{background:var(--blue);padding:18px 0 22px}
  .hero-in{max-width:1100px;margin:0 auto;padding:0 20px}
  .hero h1{font-weight:800;font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0 0 8px;letter-spacing:-1px;color:var(--black)}
  .hero p{margin:0 0 18px;font-size:15px;color:var(--black);max-width:520px}
  .search{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:14px;padding:0 14px}
  .search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:14px 0;background:transparent;color:var(--black)}
  .search input::placeholder{color:#7C868E}

  .controls{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:10;background:var(--blue);border-bottom:2px solid var(--black)}
  .controls-in{max-width:1100px;margin:0 auto;padding:0 20px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .controls-in::-webkit-scrollbar{display:none}
  .chip{flex:none;border:2px solid var(--black);background:var(--blue);color:var(--black);padding:7px 15px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--black);color:var(--white)}
  select.chip{appearance:none;-webkit-appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,#091117 50%),linear-gradient(135deg,#091117 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}

  main{max-width:1100px;margin:0 auto;padding:20px}
  .count{color:var(--muted);font-size:14px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .card{background:var(--white);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;padding:0;color:inherit;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--blue)}
  .ph{position:relative;aspect-ratio:4/3;background:var(--blue);display:grid;place-items:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .car{width:44%}
  .tags{position:absolute;top:12px;left:12px;display:flex;gap:6px}
  .tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--white);color:var(--black)}
  .tag.new{background:var(--accent);color:var(--white)}
  .tag.res{background:var(--black);color:var(--white)}
  .tag.star{background:var(--white);color:var(--black);box-shadow:inset 0 0 0 2px var(--blue)}
  .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .brand{font-size:13px;color:var(--muted);font-weight:500}
  .name{font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.3px}
  .specs{font-size:13px;color:var(--muted)}
  .price{margin-top:auto;padding-top:10px;font-weight:800;font-size:22px;letter-spacing:-.4px}
  .price small{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}

  .state{text-align:center;color:var(--muted);padding:60px 16px}
  .skel{height:320px;border-radius:var(--r);background:linear-gradient(90deg,#EEF1F3 25%,#F7F9FA 50%,#EEF1F3 75%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  footer{background:var(--black);color:var(--white);margin-top:32px}
  .foot-in{max-width:1100px;margin:0 auto;padding:32px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
  .foot-in .logo{color:var(--white)}
  .claim{font-weight:700;font-size:20px;margin:0}
  .foot-info{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:#C9D1D6}
  .foot-info a{color:var(--white);font-weight:600;text-decoration:none}
  .legal{font-size:12px;color:#8C979F}

  /* Detalle */
  .sheet{position:fixed;inset:0;z-index:50;display:none}
  .sheet.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(9,17,23,.6)}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--white);border-radius:24px 24px 0 0;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}}
  @media(min-width:760px){.panel{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:720px;border-radius:24px;max-height:90vh;animation:none}}
  .close{position:absolute;top:12px;right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--white);color:var(--black);font-size:18px;font-weight:700;line-height:1}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--blue);aspect-ratio:4/3}
  .gal>div{flex:none;width:100%;scroll-snap-align:start;display:grid;place-items:center}
  .gal img{width:100%;height:100%;object-fit:cover}
  .gal .car{width:40%}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:-24px;position:relative;height:24px}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55)}
  .dots i.on{background:var(--white)}
  .det{padding:20px 20px calc(18px + env(safe-area-inset-bottom))}
  .det .name{font-size:26px}
  .det .price{font-size:30px;padding-top:6px}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
  @media(min-width:520px){.kv{grid-template-columns:repeat(3,1fr)}}
  .kv div{background:var(--soft);border-radius:12px;padding:10px 12px}
  .kv span{display:block;font-size:12px;color:var(--muted)}
  .kv strong{font-weight:600;font-size:15px}
  .desc{line-height:1.55;margin:0 0 18px;white-space:pre-line;font-size:15px}
  .actions{display:flex;gap:10px;position:sticky;bottom:0;background:var(--white);padding-top:10px}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 12px;border-radius:14px;border:0;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
  .btn.wa{background:var(--black);color:var(--white)}
  .btn.ghost{flex:0 0 auto;background:var(--blue);color:var(--black);padding:15px 16px}
  .seals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .seal{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--black);font-size:12px;font-weight:600;padding:5px 10px 5px 7px;border-radius:999px;line-height:1.2}
  .seal svg{width:16px;height:16px;flex:none}
  .seal-box{display:grid;gap:10px;margin:16px 0 0}
  .seal-card{display:flex;gap:12px;align-items:center;background:var(--blue);color:var(--black);border-radius:14px;padding:12px 14px}
  .seal-card svg{width:30px;height:30px;flex:none}
  .seal-card strong{display:block;font-size:15px;font-weight:700}
  .seal-card span{display:block;font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--white);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="./" aria-label="carflix"><svg viewBox="0 0 30 28" fill="currentColor" aria-hidden="true"><circle cx="15" cy="7" r="6.5"/><circle cx="7" cy="20.5" r="6.5"/><circle cx="23" cy="20.5" r="6.5"/></svg><span>carflix</span></a>
    <a class="hdr-wa" id="hdrWa" href="#" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.6-.1 1.1Z"/></svg>
      Consultar
    </a>
  </div>
</header>

<section class="hero">
  <div class="hero-in">
    <h1>Tu auto, más simple.</h1>
    <p>Mirá los autos disponibles y consultanos directo por WhatsApp.</p>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#091117" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscá por marca, modelo o año" autocomplete="off">
    </label>
  </div>
</section>

<nav class="controls" aria-label="Filtros">
  <div class="controls-in">
    <button class="chip" data-cond="" aria-pressed="true">Todos</button>
    <button class="chip" data-cond="0km" aria-pressed="false">0km</button>
    <button class="chip" data-cond="usado" aria-pressed="false">Usados</button>
    <select class="chip" id="marca" aria-label="Marca"><option value="">Todas las marcas</option></select>
    <select class="chip" id="orden" aria-label="Ordenar">
      <option value="dest">Destacados</option>
      <option value="pasc">Menor precio</option>
      <option value="pdesc">Mayor precio</option>
      <option value="anio">Más nuevos</option>
      <option value="km">Menos km</option>
    </select>
  </div>
</nav>

<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<footer><div class="foot-in">
  <a class="logo" href="./" aria-label="carflix"><svg viewBox="0 0 30 28" fill="currentColor" aria-hidden="true"><circle cx="15" cy="7" r="6.5"/><circle cx="7" cy="20.5" r="6.5"/><circle cx="23" cy="20.5" r="6.5"/></svg><span>carflix</span></a>
  <p class="claim">Tu auto, más simple.</p>
  <div class="foot-info" id="foot"></div>
  <div class="legal">Precios sujetos a cambios sin previo aviso.</div>
</div></footer>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle del vehículo">
  <div class="scrim" data-close></div>
  <div class="panel" id="panel"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====== CONFIGURACIÓN ======
   El catálogo lee la planilla "Carflix - Catálogo" de Google Sheets.
   Pestaña "Vehiculos": un auto por fila. Pestaña "Config": WhatsApp, nombre, etc. */
const SHEET_ID = '1PdIxGB5PX1Fex2b5-r0-4YzIx8rso87fpgbsBCvdZ-8';
const csvUrl = tab => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;

const CAR_SVG = '<svg class="car" viewBox="0 0 120 60" fill="none" stroke="#091117" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 42V34c0-3 2-5 5-6l12-3 14-12c2-2 5-3 8-3h22c3 0 6 1 8 3l13 12 10 2c3 1 5 3 5 6v9"/><path d="M33 44h47M10 44h4M101 44h8"/><circle cx="24" cy="44" r="8"/><circle cx="90" cy="44" r="8"/><path d="M45 25h46"/></svg>';


const ICON_SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="#091117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8 7.5 9.5 4.4-1.5 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>';
const ICON_4X4 = '<svg viewBox="0 0 24 24" fill="none" stroke="#091117" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 19 6-10 4 6 2.5-3.5 6.5 7.5Z"/><circle cx="17" cy="6" r="2"/></svg>';
// Garantía: vacío o NO = sin sello; SI = sello; cualquier otro texto (ej. "6 meses") = sello con ese detalle
function garantia(c){ const v=(c.garantia||'').trim(); if(!v||norm(v)==='no') return null; return norm(v)==='si' ? '' : v; }
const gost = c => norm(c['verificado gost power'])==='si';
function sealsSmall(c){
  const g=garantia(c), out=[];
  if(g!==null) out.push(`<span class="seal">${ICON_SHIELD}Garantía mecánica${g?' · '+esc(g):''}</span>`);
  if(gost(c)) out.push(`<span class="seal">${ICON_4X4}Verificada 4x4 Gost Power</span>`);
  return out.length?`<div class="seals">${out.join('')}</div>`:'';
}
function sealsBig(c){
  const g=garantia(c), out=[];
  if(g!==null) out.push(`<div class="seal-card">${ICON_SHIELD}<div><strong>Garantía mecánica</strong><span>${g?esc(g):'Este vehículo tiene garantía mecánica. Consultanos las condiciones.'}</span></div></div>`);
  if(gost(c)) out.push(`<div class="seal-card">${ICON_4X4}<div><strong>Verificada 4x4 por Gost Power</strong><span>Revisada por nuestros amigos de Gost Power.</span></div></div>`);
  return out.length?`<div class="seal-box">${out.join('')}</div>`:'';
}

let CARS = [], CFG = {}, filt = {cond:'', marca:'', q:'', orden:'dest'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const num = s => { const n = parseFloat(String(s ?? '').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isNaN(n) ? null : n; };

function parseCSV(t){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=''; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toObjects(rows){
  const h = rows[0].map(norm);
  return rows.slice(1).map(r => Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));
}
// Acepta links de Google Drive ("compartir") y los convierte en imagen directa
function img(u){
  u = (u||'').trim(); if(!u) return '';
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
  return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1200` : u;
}
function money(car){
  const p = num(car.precio); if(p==null) return 'Consultar';
  const usd = norm(car.moneda)==='usd';
  return `<small>${usd?'US$':'$'}</small>${p.toLocaleString('es-AR',{maximumFractionDigits:0})}`;
}
function moneyText(car){ const p=num(car.precio); return p==null?'':`${norm(car.moneda)==='usd'?'US$':'$'} ${p.toLocaleString('es-AR')}`; }
const isNew = c => norm(c.condicion).startsWith('0');
const title = c => [c.modelo, c.version].filter(Boolean).join(' ');
function specs(c){
  const km = num(c.km);
  return [c.ano || c['año'], isNew(c) ? '0 km' : (km!=null ? km.toLocaleString('es-AR')+' km' : ''), c.combustible, c.transmision].filter(Boolean).join(' · ');
}
function waLink(c){
  const n = (CFG.whatsapp||'').replace(/\D/g,'');
  const base = CFG.mensaje || 'Hola! Quiero consultar por este vehículo:';
  const txt = c ? `${base}\n${c.marca} ${title(c)} ${c.ano||c['año']||''} — ${moneyText(c)}\n${location.origin+location.pathname}#auto-${c.id}` : 'Hola! Quiero hacer una consulta.';
  return `https://wa.me/${n}?text=${encodeURIComponent(txt)}`;
}

async function load(){
  try{
    const [vRes, cRes] = await Promise.all([fetch(csvUrl('Vehiculos')), fetch(csvUrl('Config')).catch(()=>null)]);
    if(!vRes.ok) throw new Error('No se pudo leer la planilla');
    if(cRes && cRes.ok){ parseCSV(await cRes.text()).slice(1).forEach(r=>{ if(r[0]) CFG[norm(r[0])] = (r[1]||'').trim(); }); }
    CARS = toObjects(parseCSV(await vRes.text()))
      .map((c,i)=>({...c, id: String(i+2)}))
      .filter(c => (c.marca || c.modelo) && norm(c.publicar)!=='no' && norm(c.estado)!=='vendido');
    applyCfg(); buildMarcas(); render(); openFromHash();
  }catch(e){
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1">No pudimos cargar el catálogo. Revisá tu conexión e intentá de nuevo.</div>`;
    console.error(e);
  }
}
function applyCfg(){
  if(CFG.nombre){ document.title = CFG.nombre+' · Tu auto, más simple.'; }
  $('#hdrWa').href = waLink();
  const f=[];
  if(CFG.direccion) f.push(`<span>${esc(CFG.direccion)}</span>`);
  if(CFG.horario) f.push(`<span>${esc(CFG.horario)}</span>`);
  if(CFG.whatsapp) f.push(`<a href="${waLink()}" target="_blank" rel="noopener">WhatsApp</a>`);
  if(CFG.instagram) f.push(`<a href="https://instagram.com/${esc(CFG.instagram.replace('@',''))}" target="_blank" rel="noopener">Instagram @${esc(CFG.instagram.replace('@',''))}</a>`);
  $('#foot').innerHTML = f.join('');
}
function buildMarcas(){
  const ms=[...new Set(CARS.map(c=>c.marca).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  $('#marca').innerHTML = '<option value="">Todas las marcas</option>'+ms.map(m=>`<option>${esc(m)}</option>`).join('');
}
function list(){
  let r = CARS.filter(c=>{
    if(filt.cond==='0km' && !isNew(c)) return false;
    if(filt.cond==='usado' && isNew(c)) return false;
    if(filt.marca && c.marca!==filt.marca) return false;
    if(filt.q){ const hay=norm([c.marca,c.modelo,c.version,c.ano,c['año'],c.color,c.combustible].join(' ')); if(!norm(filt.q).split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
  const P=c=>num(c.precio)??Infinity, Y=c=>num(c.ano||c['año'])||0, K=c=>isNew(c)?0:(num(c.km)??Infinity);
  const sorters={
    dest:(a,b)=>(norm(b.destacado)==='si')-(norm(a.destacado)==='si') || (norm(a.estado)==='reservado')-(norm(b.estado)==='reservado'),
    pasc:(a,b)=>P(a)-P(b), pdesc:(a,b)=>(num(b.precio)??-1)-(num(a.precio)??-1), anio:(a,b)=>Y(b)-Y(a), km:(a,b)=>K(a)-K(b)
  };
  return r.sort(sorters[filt.orden]);
}
function tags(c){
  let t='';
  if(norm(c.destacado)==='si') t+='<span class="tag star">Destacado</span>';
  t+= isNew(c) ? '<span class="tag new">0km</span>' : '<span class="tag">Usado</span>';
  if(norm(c.estado)==='reservado') t+='<span class="tag res">Reservado</span>';
  return `<div class="tags">${t}</div>`;
}
function render(){
  const r=list();
  $('#count').textContent = r.length===1 ? '1 vehículo' : `${r.length} vehículos`;
  if(!r.length){ $('#grid').innerHTML='<div class="state" style="grid-column:1/-1">No encontramos vehículos con esos filtros.</div>'; return; }
  $('#grid').innerHTML = r.map(c=>{
    const f=img(c.foto1);
    return `<button class="card" data-id="${c.id}">
      <div class="ph">${f?`<img src="${esc(f)}" alt="${esc(c.marca+' '+title(c))}" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(CAR_SVG))">`:CAR_SVG}${tags(c)}</div>
      <div class="body">
        <div class="brand">${esc(c.marca)}</div>
        <div class="name">${esc(title(c))}</div>
        <div class="specs">${esc(specs(c))}</div>
        ${sealsSmall(c)}
        <div class="price">${money(c)}</div>
      </div></button>`;
  }).join('');
}
function open(id){
  const c=CARS.find(x=>x.id===id); if(!c) return;
  const fotos=[c.foto1,c.foto2,c.foto3,c.foto4,c.foto5].map(img).filter(Boolean);
  const kv=[['Año',c.ano||c['año']],['Kilómetros',isNew(c)?'0 km':(num(c.km)!=null?num(c.km).toLocaleString('es-AR')+' km':'')],['Combustible',c.combustible],['Transmisión',c.transmision],['Color',c.color],['Condición',isNew(c)?'0km':'Usado']].filter(x=>x[1]);
  $('#panel').innerHTML = `
    <button class="close" data-close aria-label="Cerrar">✕</button>
    <div class="gal" id="gal">${fotos.length?fotos.map(f=>`<div><img src="${esc(f)}" alt=""></div>`).join(''):`<div>${CAR_SVG}</div>`}</div>
    ${fotos.length>1?`<div class="dots">${fotos.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`:''}
    <div class="det">
      <div class="brand">${esc(c.marca)}${norm(c.estado)==='reservado'?' · <span style="color:var(--warn)">Reservado</span>':''}</div>
      <div class="name">${esc(title(c))}</div>
      <div class="price">${money(c)}</div>
      ${sealsBig(c)}
      <div class="kv">${kv.map(([k,v])=>`<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div>
      ${c.descripcion?`<p class="desc">${esc(c.descripcion)}</p>`:''}
      <div class="actions">
        <a class="btn wa" href="${waLink(c)}" target="_blank" rel="noopener">Consultar por WhatsApp</a>
        <button class="btn ghost" id="shareBtn" aria-label="Compartir">Compartir</button>
      </div>
    </div>`;
  $('#sheet').classList.add('open'); document.body.style.overflow='hidden';
  if(location.hash!=='#auto-'+id) history.replaceState(null,'','#auto-'+id);
  const g=$('#gal'); if(g && fotos.length>1) g.addEventListener('scroll',()=>{const i=Math.round(g.scrollLeft/g.clientWidth);document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',i===j));});
  $('#shareBtn').onclick = async ()=>{
    const url=location.origin+location.pathname+'#auto-'+id, text=`${c.marca} ${title(c)} — ${moneyText(c)}`;
    try{ if(navigator.share){ await navigator.share({title:text,text,url}); return; } await navigator.clipboard.writeText(url); toast('Link copiado'); }catch(e){}
  };
}
function close(){ $('#sheet').classList.remove('open'); document.body.style.overflow=''; history.replaceState(null,'',location.pathname); }
function openFromHash(){ const m=location.hash.match(/^#auto-(\d+)/); if(m) open(m[1]); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }

document.querySelectorAll('[data-cond]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-cond]').forEach(x=>x.setAttribute('aria-pressed',x===b)); filt.cond=b.dataset.cond; render(); });
$('#marca').onchange=e=>{filt.marca=e.target.value;render();};
$('#orden').onchange=e=>{filt.orden=e.target.value;render();};
$('#q').oninput=e=>{filt.q=e.target.value;render();};
$('#grid').onclick=e=>{const c=e.target.closest('.card'); if(c) open(c.dataset.id);};
$('#sheet').onclick=e=>{ if(e.target.closest('[data-close]')) close(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
window.addEventListener('hashchange',openFromHash);
load();
</script>
</body>
</html>
